    <symbol id="wf-icon" viewBox="0 0 24 24">
      <rect x="0.5" y="0.5" width="23" height="23" rx="4" fill="none" stroke="#AAB3C0" stroke-dasharray="3 3"/>
      <path d="M6 6l12 12M18 6L6 18" stroke="#AAB3C0" stroke-width="1.5"/>
    </symbol>
    <symbol id="wf-avatar" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="19.5" fill="#DDE3EA" stroke="#AAB3C0"/>
    </symbol>
    <symbol id="wf-chip" viewBox="0 0 72 32">
      <rect x="0.5" y="0.5" width="71" height="31" rx="16" fill="none" stroke="#C9D0DA"/>
    </symbol>
    <!-- 狀態點：四種狀態用形狀區分，不依賴顏色 -->
    <symbol id="status-run" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="4" fill="#4B5563"/>
    </symbol>
    <symbol id="status-idle" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="4" fill="#9AA3AF"/>
    </symbol>
    <symbol id="status-offline" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="3.5" fill="none" stroke="#9AA3AF" stroke-width="2"/>
    </symbol>
    <symbol id="status-alarm" viewBox="0 0 16 16">
