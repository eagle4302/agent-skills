    <text x="68" y="109" font-size="14" font-weight="600" fill="#2B3038" text-anchor="middle">全部</text>
    <use href="#wf-chip" x="120" y="88" width="88" height="32"/>
    <text x="164" y="109" font-size="14" fill="#6B7280" text-anchor="middle">待處理</text>
    <use href="#wf-chip" x="216" y="88" width="88" height="32"/>
    <text x="260" y="109" font-size="14" fill="#6B7280" text-anchor="middle">已出貨</text>
    <use href="#wf-chip" x="312" y="88" width="88" height="32"/>
    <text x="356" y="109" font-size="14" fill="#6B7280" text-anchor="middle">已取消</text>

    <rect x="1000" y="80" width="256" height="40" rx="4" fill="#FFFFFF" stroke="#C9D0DA"/>
    <text x="1016" y="105" font-size="13" fill="#6B7280">2025-01-01 – 2025-12-31</text>
