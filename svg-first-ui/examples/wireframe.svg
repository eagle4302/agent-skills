<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"
     font-family="'Microsoft JhengHei UI','Segoe UI','Noto Sans TC',sans-serif">
  <title>訂單管理 — 低保真線框 v1</title>
  <desc>範例：灰色方塊只確認版面區塊、資訊層級與操作動線。長客戶名以刪節號顯示（極端值測試），實際資料由後端提供。</desc>

  <defs>
    <!-- 圖示佔位：低保真不畫真圖示 -->
    <symbol id="wf-icon" viewBox="0 0 24 24">
      <rect x="0.5" y="0.5" width="23" height="23" rx="4" fill="none" stroke="#AAB3C0" stroke-dasharray="3 3"/>
      <path d="M6 6l12 12M18 6L6 18" stroke="#AAB3C0" stroke-width="1.5"/>
    </symbol>
    <!-- 可重用：核取方塊、狀態膠囊、頭像、篩選標籤 -->
    <symbol id="wf-checkbox" viewBox="0 0 16 16">
      <rect x="0.5" y="0.5" width="15" height="15" rx="2" fill="#FFFFFF" stroke="#AAB3C0" stroke-dasharray="2 2"/>
    </symbol>
    <symbol id="wf-status" viewBox="0 0 64 24">
      <rect x="0.5" y="0.5" width="63" height="23" rx="12" fill="none" stroke="#AAB3C0" stroke-dasharray="3 3"/>
    </symbol>
    <symbol id="wf-avatar" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="11.5" fill="#DDE3EA" stroke="#AAB3C0"/>
    </symbol>
    <symbol id="wf-chip" viewBox="0 0 88 32">
      <rect x="0.5" y="0.5" width="87" height="31" rx="16" fill="none" stroke="#C9D0DA"/>
    </symbol>
  </defs>

  <rect id="bg" width="1280" height="800" fill="#FFFFFF"/>

  <!-- ── 頂部工具列 ── -->
  <g id="topbar">
    <rect x="0" y="0" width="1280" height="64" fill="#F2F4F7"/>
    <line x1="0" y1="64.5" x2="1280" y2="64.5" stroke="#C9D0DA"/>
    <use href="#wf-icon" x="24" y="16" width="32" height="32"/>
    <text x="72" y="42" font-size="20" font-weight="700" fill="#2B3038">訂單管理</text>

    <g id="topbar-controls">
      <rect x="856" y="12" width="240" height="40" rx="4" fill="#FFFFFF" stroke="#C9D0DA"/>
      <use href="#wf-icon" x="872" y="24" width="16" height="16"/>
      <text x="900" y="37" font-size="14" fill="#9AA3AF">搜尋訂單、客戶</text>
      <rect x="1112" y="12" width="144" height="40" rx="4" fill="#4B5563"/>
      <text x="1184" y="37" font-size="14" fill="#FFFFFF" text-anchor="middle">建立訂單</text>
    </g>
  </g>

  <!-- ── 篩選列 ── -->
