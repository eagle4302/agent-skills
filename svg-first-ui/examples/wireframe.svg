      <text x="664" y="217" font-size="12" fill="#4B5563" text-anchor="middle">已出貨</text>
      <text x="768" y="218" font-size="13" fill="#6B7280" font-family="'Cascadia Mono',Consolas,monospace">11-01 14:32</text>
