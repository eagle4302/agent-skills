<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"
     font-family="'Microsoft JhengHei UI','Segoe UI','Noto Sans TC',sans-serif">
  <title>訂單管理 — 高保真 v1（深色主題）</title>
  <desc>範例：同一畫面的視覺定稿。顏色、字級、間距、圓角全部對應 design/tokens.md；圖示用 defs + use 定義，代表程式中要實作成可重用元件。</desc>

  <defs>
    <!-- 圖示：全部 24×24，stroke 繼承 currentColor -->
    <symbol id="icon-orders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6h16M4 12h16M4 18h10"/>
    </symbol>
    <symbol id="icon-products" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/>
      <path d="M4 7.5l8 4.5 8-4.5"/>
      <path d="M12 12v9"/>
    </symbol>
    <symbol id="icon-customers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="8" r="3"/>
      <path d="M3 20c0-3 2.7-5 6-5s6 2 6 5"/>
      <path d="M16 5.5a3 3 0 010 5.8"/>
      <path d="M21 20c0-2.4-1.4-4.2-3.8-4.8"/>
    </symbol>
    <symbol id="icon-reports" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20h16"/>
      <path d="M6 16v-5M12 16V6M18 16v-8"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="6"/>
      <path d="M15.5 15.5L21 21"/>
    </symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 16H6l1.5-2.2V9a4.5 4.5 0 019 0v4.8L18 16z"/>
      <path d="M10 19a2 2 0 004 0"/>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5v14M5 12h14"/>
